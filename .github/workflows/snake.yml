name: BLK · the serpent

# Renders the contribution graph as a snake devouring every commit,
# in the BLK palette (charcoal / chalk). Output lands on the `output`
# branch, which the README reads from raw.githubusercontent.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serpent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23101010&color_dots=%23e9e6df,%23c4bfb4,%238b8579,%234d4941,%23101010
            dist/snake-dark.svg?color_snake=%23ece8e0&color_dots=%23141414,%233a3a37,%236b675f,%23a8a49b,%23ece8e0

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
